name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.10.12"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sync locked Python dependencies
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}

      - name: Set up Node.js for Pyright
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install locked Node.js tools
        run: npm ci

      - name: Run unit and integration tests
        run: uv run --locked --extra dev --python ${{ matrix.python-version }} pytest

      - name: Check formatting and lint
        run: |
          uv run --locked --extra dev --python ${{ matrix.python-version }} ruff check .
          uv run --locked --extra dev --python ${{ matrix.python-version }} ruff format --check .

      - name: Check types
        run: npm exec -- pyright

      - name: Build distributions
        run: uv build --python ${{ matrix.python-version }}

  pip-compatibility:
    name: pip-install (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project with pip in editable mode
        run: |
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Run tests from the pip environment
        run: pytest
